# docverify sur le cluster Chemin A multi-nœuds (lima + k3s).
#
# DaemonSet : un pod docverify par nœud. hostNetwork pour que le pod partage la
# pile réseau du nœud et atteigne le DMR de l'hôte Mac via host.lima.internal,
# un pod normal n'y arrive pas. Chaque pod tape donc le DMR Metal LOCAL de son
# Mac, sans dépendance LLM inter-nœud. L'image est importée dans le containerd
# de chaque nœud, d'où imagePullPolicy Never.
#
# Déploiement : KUBECONFIG=~/.kube/lima-k3s.yaml kubectl apply -f ce-fichier
# Chaque nœud sert l'API sur son IP LAN :8680 ; le LB de flotte les cible.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  selector:
    matchLabels:
      app: docverify
  template:
    metadata:
      labels:
        app: docverify
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: docverify
        image: docverify-docverify:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8680
          name: http
        env:
        # DMR/vLLM auto-détectés dynamiquement au démarrage par docverify.
        # - name: LLM_URL
        #   value: "http://host.lima.internal:12434/engines"
        # - name: LLM_MODEL
        #   value: "huggingface.co/unsloth/gemma-4-e4b-it-gguf:Q4_K_M"
        - name: REGISTRY_URL
          value: "http://192.168.30.25:8681" # Adresse IP du registre central/Caddy (à adapter)
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: QUEUE_WORKERS
          value: "3"
        - name: LLM_MAX_CONCURRENT
          value: "3"
        livenessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "1Gi"
---
# Service in-cluster. En hostNetwork, chaque nœud est aussi joignable
# directement sur son IP LAN :8680 ; ce Service sert la découverte interne.
apiVersion: v1
kind: Service
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  type: ClusterIP
  selector:
    app: docverify
  ports:
    - name: http
      protocol: TCP
      port: 8680
      targetPort: 8680
