apiVersion: apps/v1
kind: Deployment
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docverify
  template:
    metadata:
      labels:
        app: docverify
    spec:
      containers:
      - name: docverify
        image: alpha.srv.orbinea:5000/docverify:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8680
          name: http
        env:
        # DMR/vLLM auto-détectés dynamiquement au démarrage par docverify.
        # - name: LLM_URL
        #   value: "http://192.168.65.254:12434/engines"
        # - name: LLM_MODEL
        #   value: "huggingface.co/unsloth/gemma-4-e4b-it-gguf:Q5_K_M"
        # QUEUE_WORKERS borne le parallélisme par pod. Un GPU Metal ne traite
        # qu'une inférence à la fois : 2+ inférences concurrentes le font
        # thrasher. Bench 2026-06-25 sur facture image : 1 requête 9s, mais
        # 3 simultanées à workers=3 = 137s chacune (~15x), contre 9/19/28s à
        # workers=1 (sérialisé propre). Donc 1 worker par GPU. Pour plus de
        # débit, ajouter des Macs, pas des workers sur le même GPU.
        - name: QUEUE_WORKERS
          value: "1"
        - name: LLM_MAX_CONCURRENT
          value: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  type: LoadBalancer
  selector:
    app: docverify
  ports:
    - name: http
      protocol: TCP
      port: 8680
      targetPort: 8680
