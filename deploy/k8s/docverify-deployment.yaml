apiVersion: apps/v1
kind: Deployment
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docverify
  template:
    metadata:
      labels:
        app: docverify
    spec:
      containers:
      - name: docverify
        image: docverify-docverify:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8680
          name: http
        env:
        - name: LLM_URL
          value: "http://host.docker.internal:8000"
        livenessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  type: LoadBalancer
  selector:
    app: docverify
  ports:
    - name: http
      protocol: TCP
      port: 8680
      targetPort: 8680
