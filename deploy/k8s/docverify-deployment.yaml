apiVersion: apps/v1
kind: Deployment
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docverify
  template:
    metadata:
      labels:
        app: docverify
    spec:
      containers:
      - name: docverify
        image: docverify-docverify:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8680
          name: http
        env:
        # DMR tourne côté hôte (Docker Model Runner, Metal). On vise l'IP
        # host-gateway fixe de Docker Desktop plutôt que host.k3d.internal :
        # ce nom est injecté dans CoreDNS à la création du cluster seulement et
        # disparaît au reboot, et CoreDNS lui-même peut ne pas redémarrer. L'IP
        # 192.168.65.254 est une constante Docker Desktop, identique sur tous
        # les Macs, et supprime toute dépendance DNS du chemin LLM.
        - name: LLM_URL
          value: "http://192.168.65.254:12434/engines"
        - name: LLM_MODEL
          value: "huggingface.co/unsloth/gemma-4-e4b-it-gguf:Q8_0"
        # QUEUE_WORKERS borne le parallélisme par pod. Le total réel vaut
        # replicas x QUEUE_WORKERS et doit rester proche de la capacité LLM
        # cumulée, soit nb_de_Macs x 5 places de --max-num-seqs. Un seul Mac :
        # garder 5. Pour N Macs, monter QUEUE_WORKERS ou replicas en conséquence.
        - name: QUEUE_WORKERS
          value: "5"
        livenessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  type: LoadBalancer
  selector:
    app: docverify
  ports:
    - name: http
      protocol: TCP
      port: 8680
      targetPort: 8680
