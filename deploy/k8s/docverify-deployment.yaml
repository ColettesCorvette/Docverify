apiVersion: apps/v1
kind: Deployment
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docverify
  template:
    metadata:
      labels:
        app: docverify
    spec:
      containers:
      - name: docverify
        image: docverify-docverify:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8680
          name: http
        env:
        - name: LLM_URL
          value: "http://host.docker.internal:8000"
        - name: RSA_PRIVATE_KEY_PATH
          value: "/etc/docverify/keys/rsa-private.pem"
        volumeMounts:
        - name: rsa-key
          mountPath: /etc/docverify/keys
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "2"
            memory: "1Gi"
      volumes:
      - name: rsa-key
        secret:
          secretName: docverify-keys
          defaultMode: 0400
          items:
          - key: rsa-private.pem
            path: rsa-private.pem
---
apiVersion: v1
kind: Service
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  type: LoadBalancer
  selector:
    app: docverify
  ports:
    - name: http
      protocol: TCP
      port: 8680
      targetPort: 8680
