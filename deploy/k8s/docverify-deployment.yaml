apiVersion: apps/v1
kind: Deployment
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docverify
  template:
    metadata:
      labels:
        app: docverify
    spec:
      containers:
      - name: docverify
        image: docverify-docverify:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8680
          name: http
        env:
        # DMR tourne côté hôte (Docker Model Runner, Metal). Le proxy hôte
        # 0.0.0.0:12435 -> 127.0.0.1:12434 le rend joignable depuis les pods
        # via host.k3d.internal (DMR n'écoute que sur loopback).
        - name: LLM_URL
          value: "http://host.k3d.internal:12435/engines"
        - name: LLM_MODEL
          value: "docker.io/ai/gemma3:4B-Q4_K_M"
        # QUEUE_WORKERS borne le parallélisme par pod. Le total réel vaut
        # replicas x QUEUE_WORKERS et doit rester proche de la capacité LLM
        # cumulée, soit nb_de_Macs x 5 places de --max-num-seqs. Un seul Mac :
        # garder 5. Pour N Macs, monter QUEUE_WORKERS ou replicas en conséquence.
        - name: QUEUE_WORKERS
          value: "5"
        livenessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8680
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: docverify
  labels:
    app: docverify
spec:
  type: LoadBalancer
  selector:
    app: docverify
  ports:
    - name: http
      protocol: TCP
      port: 8680
      targetPort: 8680
