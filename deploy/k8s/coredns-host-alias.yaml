# Resolution durable de host.k3d.internal pour les pods.
#
# k3d injecte host.k3d.internal dans CoreDNS a la CREATION du cluster. Un reboot
# brut relance les conteneurs via Docker sans rejouer cette injection, donc le
# nom disparait et docverify ne joint plus le DMR hote, chaque requete tombe en
# 500. Cette ConfigMap, persistee dans le datastore k3s, est remontee par CoreDNS
# a chaque demarrage et restaure le nom sans aucun process hote ni LaunchAgent.
#
# 192.168.65.254 est l'adresse host-gateway fixe de Docker Desktop, identique sur
# toutes les installations, donc ce manifeste est portable sur tous les Macs.
# IPv4 seul, pour eviter que le client Go tente d'abord l'IPv6 de Docker Desktop.
#
# A appliquer une fois par cluster :
#   kubectl apply -f deploy/k8s/coredns-host-alias.yaml
#   kubectl rollout restart deploy/coredns -n kube-system
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  host-k3d.server: |
    host.k3d.internal:53 {
      hosts {
        192.168.65.254 host.k3d.internal
        fallthrough
      }
    }
