# DaemonSet : un pod vllm-mlx par node Darwin, donc un par Mac. Ajouter un Mac
# au cluster fait apparaître un node darwin, et le DaemonSet y place
# automatiquement un backend supplémentaire sans éditer ce fichier. Le Service
# vllm-mlx les load-balance tous via le sélecteur app=vllm-mlx.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vllm-mlx
  labels:
    app: vllm-mlx
spec:
  selector:
    matchLabels:
      app: vllm-mlx
  template:
    metadata:
      labels:
        app: vllm-mlx
    spec:
      containers:
      - name: vllm-mlx
        image: "localhost:5000/macos-vm:26.8"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
      tolerations:
      - key: "virtual-kubelet.io/provider"
        operator: "Equal"
        value: "macos-vz"
        effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: "darwin"

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-mlx
spec:
  type: ClusterIP
  selector:
    app: vllm-mlx
  ports:
  - port: 8000
    targetPort: 8000
