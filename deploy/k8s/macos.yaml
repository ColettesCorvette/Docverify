apiVersion: v1
kind: Pod
metadata:
  name: macos
  labels:
    app: vllm-mlx
spec:
  containers:
  - name: macos
    image: "localhost:5000/macos-vm:26.6"
    imagePullPolicy: IfNotPresent
    ports:
    - name: http
      containerPort: 8000
    resources:
      requests:
        cpu: "8"
        memory: 32Gi
  tolerations:
  - key: "virtual-kubelet.io/provider"
    operator: "Equal"
    value: "macos-vz"
    effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/os: "darwin"

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-mlx
spec:
  type: ClusterIP
  selector:
    app: vllm-mlx
  ports:
  - port: 8000
    targetPort: 8000
